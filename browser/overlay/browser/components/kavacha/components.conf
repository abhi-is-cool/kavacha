# Kavacha XPCOM registrations (ADR 0020). One manifest for every Kavacha
# component: the startup service below, and (from port milestone M3) each
# about: page as a JS nsIAboutModule, mirroring
# browser/components/newtab/components.conf so no Gecko C++ edit is needed.
# Every cid must be fresh and distinct; the Zen-era cids are reused verbatim
# when their pages are ported so profiles never see a component change.

Classes = [
    {
        # Constructed once per parent process as soon as the profile is usable
        # (same mechanism as browser/components/installerprefs).
        'cid': '{b0f560ce-65a4-499d-b0f3-a94a90b35ca4}',
        'contract_ids': ['@kavacha.app/startup;1'],
        'esModule': 'resource:///modules/KavachaStartup.sys.mjs',
        'constructor': 'KavachaStartup',
        'categories': {'profile-after-change': 'KavachaStartup'},
        'processes': ProcessSelector.MAIN_PROCESS_ONLY,
