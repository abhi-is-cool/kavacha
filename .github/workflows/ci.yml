# Kavacha CI — validation on every push, full browser builds on demand/tags.
#
# Full Firefox builds take 1-3 hours and exceed free-runner practicality, so the
# pipeline is split:
#   - validate: fast checks on every push/PR (JSON schemas, shellcheck, patch dry-run)
#   - nightly-build: the real per-platform browser build, manual or scheduled,
#     matching the Master Plan pipeline: push -> build -> test -> installer -> artifact

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_build:
        description: "Run full browser builds (1-3h per platform)"
        type: boolean
        default: false
      platform:
        description: "Which platforms to build (iterating one platform avoids ~3h of runner time per other platform)"
        type: choice
        default: all
        options: [all, windows, linux, macos]
  schedule:
    - cron: "0 8 * * *" # daily Nightly, 08:00 UTC

jobs:
  validate:
    name: Validate (fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files parse
        run: |
          set -e
          find . -name '*.json' -not -path './browser/firefox-source/*' -not -path './node_modules/*' | while read -r f; do
            python3 -m json.tool "$f" > /dev/null || { echo "Invalid JSON: $f"; exit 1; }
          done

      - name: Validate example documents against schemas
        run: |
          pip install --quiet jsonschema
          python3 - <<'EOF'
          import json, pathlib
          from jsonschema import validate
          def load(p): return json.loads(pathlib.Path(p).read_text())
          validate(load("customization/layout-engine/default-layout.json"),
                   load("customization/layout-engine/layout.schema.json"))
          validate(load("customization/themes/kavacha-midnight/manifest.json"),
                   load("customization/themes/theme-manifest.schema.json"))
          print("schema validation OK")
          EOF

      # Print the version: this gate is only as strong as the binary running it,
      # and the two differ. 0.9.0 (the runner image's) reports SC2015 on
      # `A && B || continue`; 0.11.0 does not, so a local 0.11 check passes code
      # that fails here. Match the version before trusting a local run.
      - name: Shellcheck build scripts
        run: |
          sudo apt-get install -y shellcheck
          shellcheck --version
          shellcheck build/*.sh

      - name: Overlay modules parse
        run: |
          shopt -s globstar nullglob
          files=(browser/overlay/**/*.mjs browser/overlay/**/*.js)
          if [ ${#files[@]} -eq 0 ]; then echo "overlay has no scripts yet"; exit 0; fi
          for f in "${files[@]}"; do node --check "$f"; done
          echo "${#files[@]} overlay script(s) parse"

      # Three silent failures a build cannot catch: a Fluent id defined in two
      # Kavacha .ftl files (they share one bundle, so the second is dropped);
      # a top-level const/let/class in a window script (it shares browser.js's
      # scope, so it aborts that whole file); and an unsorted EXTRA_JS_MODULES,
      # which fails the moz.build read because mozbuild sorts case-insensitively
      # and Python does not. All three were real — see the script's header.
      - name: Overlay static checks (Fluent ids, window-script scope, list order)
        run: python3 build/check-overlay.py

      - name: Kavacha patches apply cleanly to Firefox ESR
        run: |
          shopt -s nullglob
          patches=(browser/patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then echo "no patches yet"; exit 0; fi
          # Validate against the PINNED Firefox commit, never the moving tip
          # (ADR 0020). Read the pin from bootstrap.sh so there is exactly one
          # source of truth; a second literal here would drift from the real one.
          pin="$(sed -n 's/^FIREFOX_COMMIT="\([0-9a-f]\{40\}\)".*/\1/p' build/bootstrap.sh)"
          if [ -z "$pin" ]; then
            echo "could not read FIREFOX_COMMIT from build/bootstrap.sh"; exit 1
          fi
          echo "validating against pinned Firefox $pin"

          # Firefox at depth 1 is ~1 GB of tree; a blob-less partial clone with a
          # sparse checkout limited to the directories the patches touch keeps
          # this step at seconds. The pin is fetched by SHA (GitHub permits it).
          dirs="$(grep -h '^+++ b/' "${patches[@]}" | sed 's#^+++ b/##' | xargs -n1 dirname | sort -u)"
          git init -q /tmp/ff
          git -C /tmp/ff remote add origin https://github.com/mozilla-firefox/firefox.git
          git -C /tmp/ff config core.sparseCheckout true
          git -C /tmp/ff sparse-checkout init --cone
          # shellcheck disable=SC2086
          git -C /tmp/ff sparse-checkout set $dirs
          git -C /tmp/ff fetch -q --depth 1 --filter=blob:none origin "$pin"
          git -C /tmp/ff checkout -q FETCH_HEAD

          # Patches are ordered and may build on each other, so apply each one
          # for real, in sequence.
          for p in "${patches[@]}"; do
            echo "applying $p"
            git -C /tmp/ff apply "$GITHUB_WORKSPACE/$p"
          done

  # Which platforms this run builds. A static matrix cannot be filtered by a
  # dispatch input (job-level `if` has no `matrix` context), so the matrix is
  # emitted here and consumed with fromJSON. Iterating one platform matters:
  # each of the others costs ~3h of runner time to tell us nothing.
  select-platforms:
    name: Select platforms
    needs: validate
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_build)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        # Python rather than jq: jq is on the runner but not on the dev host,
        # and a step that cannot be run locally is a step that gets debugged in
        # CI. The selection arrives by env, not by ${{ }} interpolation into
        # the script, so the input cannot reach the shell as code.
        env:
          SEL: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json, os, sys
          ALL = [
              {"os": "ubuntu-latest",  "platform": "linux"},
              {"os": "macos-latest",   "platform": "macos"},
              {"os": "windows-latest", "platform": "windows"},
          ]
          # Empty on a schedule, where `inputs` does not exist: build everything.
          sel = os.environ.get("SEL", "").strip()
          inc = ALL if sel in ("", "all") else [e for e in ALL if e["platform"] == sel]
          if not inc:
              sys.exit("no platform matched %r" % sel)
          print("building: " + ", ".join(e["platform"] for e in inc), file=sys.stderr)
          print("matrix=" + json.dumps({"include": inc}))
          EOF
        shell: bash
  nightly-build:
    name: Nightly build (${{ matrix.os }})
    # Full builds only on schedule or when explicitly requested.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_build)
    needs: [validate, select-platforms]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-platforms.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # Cold builds on 3-4 core hosted runners take ~4h; 360 is GitHub's job max.
    timeout-minutes: 360
    env:
      # bootstrap.sh writes --with-ccache=<sccache> + RUSTC_WRAPPER into the
      # mozconfig when sccache is on PATH; the GHA backend needs these.
      SCCACHE_GHA_ENABLED: "true"
      MACH_HIDE_DEV_DRIVE_SUGGESTION: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Stock ubuntu runners don't have the ~40GB a Firefox build needs; the
      # runner gets killed mid-compile ("shutdown signal") when disk fills.
      - name: Free disk space (Linux)
        if: matrix.platform == 'linux'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false

      - name: Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libdbus-glib-1-dev libasound2-dev xvfb
        shell: bash

      # Persistent compile cache across nightlies. The first cold build
      # populates it; later builds should drop from ~4h to well under an hour
      # on cache hits. GitHub caps the repo cache at 10GB LRU, shared across
      # platforms — partial hits expected. continue-on-error: the action's
      # post-run stats step can fail and must not poison the job result.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        continue-on-error: true

      - name: Expose actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'])
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL'])
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'])

      # 16GB hosted runners can't take Firefox's default build parallelism:
      # Linux runners die with a "shutdown signal" (OOM kills the runner
      # agent) and Windows rustc hits LLVM out-of-memory with full debuginfo.
      # Cap -j and drop debug symbols on both; macOS runners cope as-is.
      # bootstrap.sh appends $KV_MOZCONFIG_EXTRA to the mozconfig it writes.
      - name: Runner memory caps (Linux, Windows)
        if: matrix.platform != 'macos'
        run: |
          jobs=2; [ "${{ matrix.platform }}" = "windows" ] && jobs=3
          {
            echo 'KV_MOZCONFIG_EXTRA<<EOF'
            echo "mk_add_options MOZ_MAKE_FLAGS=\"-j$jobs\""
            echo 'ac_add_options --disable-debug-symbols'
            echo 'EOF'
          } >> "$GITHUB_ENV"
        shell: bash

      # generate-branding.sh renders every icon with Pillow; bootstrap.sh
      # commits the overlay into the checkout, so git needs an identity.
      - name: Configure git identity + icon tooling
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # `python3` is not reliably on PATH in Git Bash on a windows runner,
          # and `python` is not always on PATH on ubuntu. Resolve one here.
          PY=python3; command -v $PY >/dev/null 2>&1 || PY=python
          $PY -m pip install --quiet pillow
        shell: bash

      # mach needs MozillaBuild's shell; bootstrap.sh re-executes itself under
      # it when $MOZILLABUILD is unset. Firefox's tree exceeds MAX_PATH.
      - name: Windows build prerequisites
        if: matrix.platform == 'windows'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
          (New-Object System.Net.WebClient).DownloadFile("https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe", "C:\MozillaBuildSetup-Latest.exe")
          Start-Process -FilePath C:\MozillaBuildSetup-Latest.exe -ArgumentList '/S' -Wait
          C:\mozilla-build\python3\python3.exe -m pip install --quiet pillow
          New-Item -ItemType Junction -Path C:\k -Target $env:GITHUB_WORKSPACE
        shell: pwsh

      # setup: fetch Firefox at the pin, mozconfig, overlay, patches, branding,
      # mach bootstrap (downloads the toolchains; on Windows that includes the
      # packaged MSVC toolchain — no Visual Studio is used).
      - name: Setup (fetch Firefox + mach bootstrap)
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then cd /c/k; fi
          ./build/bootstrap.sh setup
        shell: bash

      # Disk before the build, so the failure diagnostics below have a baseline
      # to subtract from. ~/.mozbuild lands on C: ($HOME is the runner's profile)
      # and holds the packaged MSVC sysroot (~6.5 GB) plus the toolchains, while
      # the source and objdir sit on D: via the C:\k junction — the two drives
      # fill for different reasons and both have to be watched.
      - name: Disk and toolchain state after setup (Windows)
        if: matrix.platform == 'windows'
        run: |
          Get-CimInstance Win32_LogicalDisk |
            Select-Object DeviceID,
              @{n='FreeGB';e={[math]::Round($_.FreeSpace/1GB,1)}},
              @{n='SizeGB';e={[math]::Round($_.Size/1GB,1)}} | Format-Table -AutoSize
          foreach ($d in @("$env:USERPROFILE\.mozbuild", "C:\k\browser\firefox-source")) {
            if (Test-Path $d) {
              $gb = [math]::Round(((Get-ChildItem $d -Recurse -File -ErrorAction SilentlyContinue |
                     Measure-Object Length -Sum).Sum / 1GB), 2)
              Write-Output "$d = $gb GB"
            }
          }
        shell: pwsh

      # tee the build: on failure the job otherwise ends on a single make line
      # with no retained output, which is exactly what made the 2026-09-20
      # Windows failure undiagnosable. pipefail so tee cannot mask a failed
      # build the way `cmd | tail` masked one locally the same day.
      # One retry, Windows only, and it is a WORKAROUND rather than a fix.
      # The 2026-09-21 diagnostics showed the failing object present on disk,
      # 26 KB, written six minutes before make declared "No rule to make
      # target" for it — with its backend.mk, its rule and the root-deps.mk
      # ordering edge all correct and matching the dev host exactly. The
      # remaining explanation is that make's cached directory listing predates
      # the object, which is timing-dependent on -j (the host builds at -j24,
      # this runner is capped at -j3 for rustc OOM). A second pass re-reads the
      # directory. If this retry is what makes Windows green, that is a real
      # upstream build-system quirk being worked around, and it is annotated so
      # no run can be mistaken for a clean first-pass build. VERIFICATION §4j.
      - name: Build
        run: |
          set -o pipefail
          if [ "${{ matrix.platform }}" = "windows" ]; then cd /c/k; fi
          if ./build/bootstrap.sh build 2>&1 | tee "$RUNNER_TEMP/mach-build.log"; then
            exit 0
          fi
          if [ "${{ matrix.platform }}" != "windows" ]; then
            echo "build failed"
            exit 1
          fi
          echo "::warning title=Windows build needed a retry::The first mach build failed; retrying once. A green result here is NOT a clean first-pass build - see VERIFICATION 4j."
          ./build/bootstrap.sh build 2>&1 | tee "$RUNNER_TEMP/mach-build-retry.log"
        shell: bash

      # Runs whether or not the build succeeded. The 2026-09-20 failure was
      # `No rule to make target <libwebrtc obj>, needed by xul.dll`, which means
      # either that object was never built or its directory's backend was never
      # generated. This separates those two from each other and both from "the
      # disk filled up", without another blind three-hour run.
      # ADR 0020 reason 2 (amended) / VERIFICATION §4j.
      - name: Windows build diagnostics
        if: always() && matrix.platform == 'windows'
        run: |
          cd /c/k || exit 0
          obj="$(find browser/firefox-source -maxdepth 1 -type d -name 'obj-*' 2>/dev/null | head -1)"
          echo "=== disk now ==="
          df -h 2>/dev/null || true
          echo "=== objdir: ${obj:-<none>} ==="
          if [ -z "$obj" ]; then echo "no objdir at all"; exit 0; fi

          gn="$obj/third_party/libwebrtc/modules/congestion_controller/goog_cc_scream_network_controller/goog_cc_scream_network_controller_gn"
          echo "=== the directory that had no rule ==="
          if [ -d "$gn" ]; then
            ls -la "$gn"
            for f in backend.mk Makefile Unified_cpp_etwork_controller_gn0.cpp Unified_cpp_etwork_controller_gn0.obj; do
              if [ -e "$gn/$f" ]; then echo "  present: $f"; else echo "  MISSING: $f"; fi
            done
            echo "--- does backend.mk name the object? ---"
            grep -c "Unified_cpp_etwork_controller_gn0" "$gn/backend.mk" 2>/dev/null || echo "  no backend.mk to grep"
          else
            echo "  DIRECTORY ABSENT - the backend never generated it"
          fi

          # Partial backend generation shows up as a count mismatch across the
          # whole libwebrtc tree, not only in the directory that happened to fail.
          echo "=== libwebrtc backend coverage ==="
          lw="$obj/third_party/libwebrtc"
          echo "  dirs:        $(find "$lw" -type d 2>/dev/null | wc -l)"
          echo "  backend.mk:  $(find "$lw" -name backend.mk 2>/dev/null | wc -l)"
          echo "  Makefile:    $(find "$lw" -name Makefile 2>/dev/null | wc -l)"
          echo "  .obj:        $(find "$lw" -name '*.obj' 2>/dev/null | wc -l)"

          # A backend regenerated mid-build is a live hypothesis: it happened on
          # the dev host when a moz.build mtime changed.
          echo "=== backend regenerated during the build? ==="
          grep -n "Regenerating backend\|Build configuration changed\|config\.status" \
            "$RUNNER_TEMP/mach-build.log" 2>/dev/null | head -20 || echo "  no such lines"

          echo "=== disk-full signatures in the log ==="
          grep -niE "no space left|not enough space|disk full|insufficient" \
            "$RUNNER_TEMP/mach-build.log" 2>/dev/null | head -10 || echo "  none"

          echo "=== sccache ==="
          sccache --show-stats 2>&1 | head -20 || echo "  sccache unavailable"
        shell: bash

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mach-build-log-${{ matrix.platform }}
          path: ${{ runner.temp }}/mach-build*.log
          if-no-files-found: warn
          retention-days: 14

      # `mach package` produces the distributables (DMG / tar / zip + update
      # MAR) in obj-*/dist/. On Windows it runs NSIS itself (the make-package
      # rule in toolkit/mozapps/installer/packager.mk) and drops
      # kavacha-<version>.<locale>.win64.installer.exe next to the zip — there
      # is no separate `mach build installer` step, and asking for one fails
      # with "No rule to make target" (observed 2026-09-19).
      - name: Package
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then cd /c/k; fi
          ./build/bootstrap.sh package
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kavacha-nightly-${{ matrix.platform }}
          path: |
            browser/firefox-source/obj-*/dist/*.dmg
            browser/firefox-source/obj-*/dist/*.tar.*
            browser/firefox-source/obj-*/dist/*.zip
            browser/firefox-source/obj-*/dist/*.installer.exe
            browser/firefox-source/obj-*/dist/update/*.mar
          if-no-files-found: error
          retention-days: 14

      # R3 (SHIPPING.md): the network-silence gate. Runs the just-built binary
      # headless on a fresh profile and fails if it contacts any telemetry /
      # advertising / experimentation host — the load-bearing proof of Kavacha's
      # privacy claim, on the real artifact. Linux and Windows: the behaviour
      # is pref-driven, but Windows has its own phone-home surface (the
      # default-browser agent, disabled at configure time) worth proving.
      # Placed after the upload so a regression marks the build red without
      # withholding the binary.
      - name: Network-silence test (R3)
        if: matrix.platform == 'linux' || matrix.platform == 'windows'
        run: |
          objbin="$(ls -d browser/firefox-source/obj-*/dist/bin 2>/dev/null | head -1)"
          app=""
          for cand in "$objbin/kavacha" "$objbin/kavacha.exe"; do
            [ -f "$cand" ] && app="$cand" && break
          done
          if [ -z "$app" ]; then
            echo "could not find the built binary under $objbin"; ls -la "$objbin" || true; exit 1
          fi
          echo "testing $app"
          PY=python3; command -v $PY >/dev/null 2>&1 || PY=python
          $PY test/network-silence/network_silence_test.py --app "$app" --headless --idle 40
        shell: bash

      # L4 probes over Marionette on the real artifact: the M2 substrate (104
      # checks), Phase 7 (78) and the workspace restart round-trip (3 + 7
      # across a real relaunch) — 192 in total. This is load-bearing, not
      # informational: the substrate landed at port milestone M2 and these are
      # the gates VERIFICATION.md §4f-§4i record. marionette-ci.py launches and
      # kills a browser per probe on its own fresh profile; sharing one profile
      # lets probes change each other's answers (the restart probe read 4/7
      # chained and 7/7 clean, 2026-09-20).
      - name: Marionette probes (substrate, Phase 7, restart)
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then cd /c/k; fi
          PY=python3; command -v $PY >/dev/null 2>&1 || PY=python
          # The indexer actor's content-process paths need the sandbox off on
          # macOS (see REMAINING_WORK's harness notes).
          extra=""
          if [ "${{ matrix.platform }}" = "macos" ]; then extra="--no-sandbox"; fi
          # shellcheck disable=SC2086
          $PY build/marionette-ci.py --headless $extra
        shell: bash

  # Rolling "nightly" prerelease: Actions artifacts require a GitHub login to
  # download, a Release gives a public link anyone can try. The tag is moved
  # to the built commit each publish.
  publish-nightly:
    name: Publish nightly release
    needs: nightly-build
    # always(): publish whatever platforms succeeded even if one failed; the
    # carry-forward step below keeps a failed platform's last good binary.
    # Never publish a single-platform iteration run: it would move the nightly
    # tag and carry the other platforms forward from an older build, which is
    # exactly the shape of result this project keeps mistaking for success.
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_build && (inputs.platform == 'all' || inputs.platform == '')))
    runs-on: ubuntu-latest
    # Serialize publishes: a manual full_build dispatch can overlap the 08:00
    # scheduled run (builds take hours). Two interleaved publish jobs can each
    # read/modify/write the same release and drop the other's assets.
    concurrency:
      group: kavacha-nightly-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release files
        run: |
          set -e
          mkdir -p out
          shopt -s nullglob
          for f in artifacts/kavacha-nightly-macos/*.dmg; do
            cp "$f" "out/kavacha-nightly-macos-arm64.dmg"
          done
          for f in artifacts/kavacha-nightly-linux/*.tar.*; do
            ext="${f#*.tar.}"
            cp "$f" "out/kavacha-nightly-linux-x86_64.tar.${ext}"
          done
          for f in artifacts/kavacha-nightly-windows/*.exe artifacts/kavacha-nightly-windows/**/*.exe; do
            cp "$f" "out/kavacha-nightly-windows-x86_64.exe"
          done
          for f in artifacts/kavacha-nightly-windows/*.zip; do
            cp "$f" "out/kavacha-nightly-windows-x86_64.zip"
          done
          ls -la out
          [ -n "$(ls -A out)" ] || { echo "no release files found"; exit 1; }

      # A platform whose build failed this run must not lose its last good
      # binary: delete-and-recreate below would otherwise publish a release
      # missing that platform (happened 2026-07-15 — macOS hit the 6h job
      # ceiling and the nightly shipped Linux-only). Carry forward any prior
      # asset we don't have a fresh replacement for.
      - name: Carry forward assets from the previous nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p prev
          gh release download nightly --dir prev --pattern '*' --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          shopt -s nullglob
          : > carried.txt
          for f in prev/*; do
            base="$(basename "$f")"
            if [ ! -e "out/$base" ]; then
              echo "::warning::carrying forward stale asset: $base (this platform's build failed this run)"
              cp "$f" "out/$base"
              echo "$base" >> carried.txt
            fi
          done
          ls -la out

      # Upsert, never delete-and-recreate: the old flow ran `gh release delete`
      # before `gh release create`, so a failed create (transient API error)
      # destroyed the release AND every carried-forward last-good binary with
      # no recovery path. Move the tag, then update the release in place.
      # Carried-forward assets are named in the notes so a stale binary can't
      # masquerade as today's build.
      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          CARRIED=""
          if [ -s carried.txt ]; then
            CARRIED="

          WARNING - the following assets are carried forward from an earlier nightly because this run's build for that platform failed; they do NOT contain this commit's changes:
          $(sed 's/^/- /' carried.txt)"
          fi
          NOTES="Automated Kavacha nightly from commit ${GITHUB_SHA:0:7} ($(date -u +%Y-%m-%d)).${CARRIED}

          Unsigned development builds — macOS: right-click the app and choose Open the first time, or run: xattr -dr com.apple.quarantine /Applications/Kavacha.app — Windows: SmartScreen will warn; choose More info → Run anyway, or use the .zip and run kavacha.exe from the extracted folder.

          Not audited yet; see the roadmap for release gates."
          TITLE="Kavacha Nightly ($(date -u +%Y-%m-%d))"
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin nightly
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly out/* --clobber
            gh release edit nightly --prerelease --title "$TITLE" --notes "$NOTES"
          else
            gh release create nightly out/* \
              --prerelease \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

  # TODO (before Developer Preview): code signing + notarization, reproducible-build
  # verification, dependency audit gates (cargo audit / npm audit), network-silence
  # privacy test on the built binary. Tracked in documentation/ROADMAP.md.
